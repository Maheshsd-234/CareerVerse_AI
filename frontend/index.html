<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerVerse AI — Your AI Career Route</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#FAFAF7] text-[#12122B] antialiased selection:bg-[#4F46E5] selection:text-white">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Startup error caught in index.html:', e.error || e.message, e);
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;background:#FAFAF7;">' +
            '<div style="max-width:480px;width:100%;margin:0 auto;background:#fff;padding:32px;border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,0.08);border:1px solid #e5e7eb;text-align:center;">' +
            '<div style="width:48px;height:48px;border-radius:14px;background:#eef2ff;color:#4f46e5;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;margin-bottom:16px;">CV</div>' +
            '<h2 style="font-size:20px;font-weight:bold;color:#12122b;margin:0 0 8px 0;">Waypoint Calibration</h2>' +
            '<p style="font-size:13px;color:#6b7280;margin:0 0 20px 0;line-height:1.5;">A display sync error occurred. Click below to refresh your dashboard with clean market calibration.</p>' +
            '<button onclick="localStorage.removeItem(\'careerverse_market_velocity_radar_2026\');sessionStorage.clear();window.location.href=\'/\';" style="background:#4f46e5;color:#fff;border:none;padding:12px 24px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer;width:100%;">Reload Dashboard</button>' +
            '</div></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
