version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: careerverse_qdrant
    ports:
      - "6333:6333"   # HTTP REST + gRPC
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

volumes:
  qdrant_data:
