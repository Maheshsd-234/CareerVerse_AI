version: "3.9"

# ── CareerVerse AI — local development stack ─────────────────────────────────
# Usage:
#   docker compose up -d          # start Qdrant in background
#   docker compose logs -f qdrant # tail logs
#   docker compose down           # stop (data persisted in qdrant_data volume)
#   docker compose down -v        # stop AND delete all vector data

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: careerverse_qdrant
    ports:
      - "6333:6333"   # HTTP REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_data:
    name: careerverse_qdrant_data
